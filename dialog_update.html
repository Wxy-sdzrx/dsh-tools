<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>检查更新</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body { font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif; font-size:12.5px;
         color:#222; background:#fff; padding:12px 14px 48px; box-sizing:border-box; }
  .hd  { font-size:14.5px; font-weight:600; margin:0 0 5px; }
  .hd.ok { color:#1a7f37; }
  .ver { margin:0 0 7px; color:#444; line-height:1.7; }
  .ver b { font-family:Consolas,"Microsoft YaHei UI",monospace; }
  .ver b.new { color:#1a7f37; }
  .note { color:#555; background:#f8f8f8; border-left:3px solid #e3e3e3; padding:5px 8px;
          margin:0 0 8px; max-height:46px; overflow:auto; white-space:pre-wrap;
          line-height:1.45; font-size:11.5px; }
  .row { display:flex; align-items:center; border:1px solid #e4e4e4; border-radius:4px;
         padding:6px 8px; margin-bottom:7px; }
  .row .txt { flex:1; min-width:0; line-height:1.45; }
  .row .txt b { display:block; font-size:12.5px; margin-bottom:1px; }
  .row .txt span { color:#777; font-size:11.5px; }
  .row .txt em { color:#8a5a00; font-style:normal; }
  .row button { flex:0 0 auto; margin-left:10px; padding:5px 12px; font-size:12.5px;
                cursor:pointer; border:1px solid #c2c2c2; border-radius:3px;
                background:#fff; white-space:nowrap; }
  .row button.primary { background:#1a7f37; color:#fff; border-color:#1a7f37; }
  .bar { height:10px; background:#eee; border-radius:5px; overflow:hidden; margin:9px 0 7px; }
  #fill { height:100%; width:0%; background:#1a7f37; transition:width .2s; }
  .st { color:#444; min-height:17px; font-size:12.5px; }
  .st.dim { color:#888; }
  .list { margin:7px 0 0; font-family:Consolas,"Microsoft YaHei UI",monospace;
          font-size:11px; color:#aaa; line-height:1.65; max-height:96px; overflow:hidden; }
  .list .d { color:#1a7f37; }
  .list .c { color:#111; font-weight:600; }
  .warn { color:#8a5a00; background:#fff8e6; border:1px solid #f0dca8; border-radius:3px;
          padding:5px 8px; margin-top:7px; line-height:1.45; font-size:11.5px; }
  .url { width:100%; box-sizing:border-box; font-family:Consolas,monospace; font-size:11.5px;
         padding:5px 7px; border:1px solid #c2c2c2; border-radius:3px; margin-top:8px; }
  .ft { position:absolute; right:14px; bottom:12px; }
  .ft button { padding:5px 16px; font-size:12.5px; cursor:pointer; margin-left:8px; }
  .ft button.primary { background:#1a7f37; color:#fff; border:1px solid #1a7f37; border-radius:3px; }
  .warn.inline { margin:0 0 8px; }
</style>
</head>
<body>

<!-- 询问 -->
<div id="ask">
  <div class="hd">发现新版本</div>
  <div class="ver">当前版本 <b id="cur">—</b>　→　最新版本 <b class="new" id="new">—</b></div>
  <div class="note" id="note">—</div>
  <div class="warn inline" id="autoTip" style="display:none">这是 WPS 启动时自动检查发现的，不用急着处理。</div>

  <div class="row">
    <div class="txt">
      <b>方式一：直接更新</b>
      <span>由插件自动下载并替换，完成后重启 WPS 生效。</span>
      <span><em>需先关闭 WPS 的「沙箱保护」</em>（设置中心 → 安全）。</span>
    </div>
    <button class="primary" id="go1">直接更新</button>
  </div>

  <div class="row">
    <div class="txt">
      <b>方式二：复制下载链接</b>
      <span>一键复制安装包地址，粘贴到浏览器下载。<em>不需改任何设置。</em></span>
    </div>
    <button id="go2">复制链接</button>
  </div>

  <div class="ft"><button id="no">关闭</button></div>
</div>

<!-- 进行中 -->
<div id="work" style="display:none">
  <div class="hd">正在更新…</div>
  <div class="bar"><div id="fill"></div></div>
  <div class="st" id="st">正在启动更新器…</div>
  <div class="list" id="list"></div>
  <div class="warn">若系统弹出「已拦截 / 是否允许」提示，<b>请选择【放行】</b>，否则更新无法完成。</div>
</div>

<!-- 成功 -->
<div id="done" style="display:none">
  <div class="hd ok">★ 更新成功</div>
  <div class="st" id="doneMsg">—</div>
  <div class="warn">请【完全退出 WPS 再打开】，新版本才会生效。</div>
  <div class="ft"><button id="ok2" class="primary">确定</button></div>
</div>

<!-- 链接已复制 -->
<div id="link" style="display:none">
  <div class="hd ok">★ 链接已复制</div>
  <div class="st" id="linkMsg">粘贴到浏览器地址栏即可下载。</div>
  <input class="url" id="urlBox" readonly spellcheck="false">
  <div class="ft"><button id="ok4" class="primary">确定</button></div>
</div>

<!-- 已排队 -->
<div id="err" style="display:none">
  <div class="hd">已排队：稍后自动完成</div>
  <div class="st" id="errMsg" style="font-size:11.5px;line-height:1.55">—</div>
  <div class="ft">
    <button id="copy2">复制下载链接</button>
    <button id="ok3" class="primary">关闭</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  function q(name) {
    try {
      var m = new RegExp('[?&]' + name + '=([^&]*)').exec(String(location.search || ''));
      return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
    } catch (e) { return ''; }
  }
  function show(id) {
    var ids = ['ask', 'work', 'done', 'link', 'err'];
    for (var i = 0; i < ids.length; i++) {
      document.getElementById(ids[i]).style.display = (ids[i] === id) ? '' : 'none';
    }
  }
  function closeMe() {
    try { if (window.wps && wps.Dialog && wps.Dialog.close) { wps.Dialog.close(); return; } } catch (e) { }
    try { window.close(); } catch (e) { }
  }

  var curV = q('cur'), newV = q('new'), note = q('note'), dir = q('dir');
  var dlUrl = q('url');
  var fileList = q('files') ? q('files').split(',') : [];

  document.getElementById('cur').textContent = curV || '—';
  document.getElementById('new').textContent = newV || '—';
  var noteEl = document.getElementById('note');
  if (note) { noteEl.textContent = '更新内容： ' + note; } else { noteEl.style.display = 'none'; }
  if (q('mode') === 'auto') { document.getElementById('autoTip').style.display = ''; }
  document.getElementById('urlBox').value = dlUrl;

  function copyLink() {
    if (!dlUrl) {
      document.getElementById('linkMsg').textContent = '版本清单里没有填下载地址，请向维护人索取。';
      show('link'); return;
    }
    var box = document.getElementById('urlBox');
    var ok = false;
    try { box.focus(); box.select(); ok = document.execCommand('copy'); } catch (e) { }
    if (ok) { document.getElementById('linkMsg').textContent = '已复制到剪贴板，粘贴到浏览器地址栏即可下载。'; show('link'); return; }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(dlUrl).then(function () {
          document.getElementById('linkMsg').textContent = '已复制到剪贴板，粘贴到浏览器地址栏即可下载。';
          show('link');
        }, function () {
          document.getElementById('linkMsg').textContent = '自动复制失败，请选中下面的地址按 Ctrl+C。';
          show('link');
        });
        return;
      }
    } catch (e) { }
    document.getElementById('linkMsg').textContent = '自动复制失败，请选中下面的地址按 Ctrl+C。';
    show('link');
  }

  /* 读更新器写下的进度。插件读不了文件，所以靠注入同目录的 update-status.js。 */
  function pollStatus(sinceTs, cb) {
    var old = document.getElementById('dshSt');
    if (old) { try { old.parentNode.removeChild(old); } catch (e) { } }
    var s = document.createElement('script');
    s.id = 'dshSt';
    s.src = 'update-status.js?_t=' + (new Date()).getTime();
    s.onload = function () {
      var R = null;
      try { R = window.DSH_UPDATE_RESULT; } catch (e) { }
      if (R && R.ts && R.ts >= sinceTs) { cb(R); return; }
      cb(null);
    };
    s.onerror = function () { cb(null); };
    try { document.head.appendChild(s); } catch (e) { cb(null); }
  }

  function renderList(doneCount) {
    if (!fileList.length) { return; }
    var h = '';
    for (var i = 0; i < fileList.length; i++) {
      var cls = (i < doneCount) ? 'd' : (i === doneCount ? 'c' : '');
      var mark = (i < doneCount) ? '✓ ' : (i === doneCount ? '→ ' : '   ');
      h += '<div class="' + cls + '">' + mark + fileList[i] + '</div>';
    }
    document.getElementById('list').innerHTML = h;
  }

  var timer = null, t0 = 0, secs = 0;
  function setProgress(p) { document.getElementById('fill').style.width = Math.max(0, Math.min(100, p)) + '%'; }
  function setSt(t, dim) { var el = document.getElementById('st'); el.textContent = t; el.className = dim ? 'st dim' : 'st'; }

  function startUpdate() {
    show('work'); setProgress(3); setSt('正在启动更新器…');
    t0 = (new Date()).getTime() - 3000;
    renderList(0);
    var launched = false, launchErr = '';
    try {
      var OA = (window.wps && wps.OAAssist) ? wps.OAAssist : null;
      var bat = dir + 'update.bat';
      var vbs = dir + 'update.vbs';
      var ps = 'powershell.exe';
      var psArgs = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "' + dir + 'updater.ps1"';
      if (OA && typeof OA.ShellExecute === 'function') {
        /* vbs 排第一：由 wscript.exe 跑，不创建控制台窗口（bat 由 cmd 跑，必有黑框）。
           实测 ShellExecute(powershell, 参数) 和在 WPS 里也抛错，
           所以「只给一个文件路径」是唯一能用的形式。 */
        /* 候选只保留【文件路径】这一种形式。
           曾加过自定义 URL 协议 bianjie-update:// 想绕开沙箱，实测证伪：
             · 沙箱开着时被拦；沙箱关掉后仍然抛错；
             · 未注册该协议的机器上，Windows 会弹「获取打开此链接的应用」——纯干扰。
           所以整条删除，不再注册也不再尝试。 */
        var tries = [
          function () { OA.ShellExecute(vbs); },
          function () { OA.ShellExecute(bat); },
          function () { OA.ShellExecute(bat, ''); },
          function () { OA.ShellExecute(ps, psArgs); }
        ];
        for (var ti = 0; ti < tries.length; ti++) {
          try { tries[ti](); launched = true; break; }
          catch (et) { launchErr = (et && et.message) ? et.message : String(et); }
        }
      } else { launchErr = '本 WPS 未提供 OAAssist'; }
    } catch (e) { launchErr = (e && e.message) ? e.message : String(e); }

    secs = 0;
    timer = setInterval(function () {
      secs++;
      pollStatus(t0, function (R) {
        if (!R) {
          if (secs === 6) { setSt('等待更新器启动…（若弹出拦截提示，请选【放行】）', true); }
          if (secs >= 20) {
            clearInterval(timer);
            show('err');
            document.getElementById('errMsg').textContent =
              '这次没能启动更新程序 —— WPS 的「沙箱保护」拦住了（正常行为，不是出错）。\n' +
              '最快办法：双击下面这个文件，几秒完成，不用重启：\n' +
              dir + 'update.bat\n' +
              '或者：不管它，下次开机登录时会自动完成。';
          }
          return;
        }
        if (R.state === 'downloading') {
          setProgress(5 + (R.done / Math.max(1, R.total)) * 55);
          setSt('正在下载 ' + R.done + '/' + R.total);
          renderList(R.done);
        } else if (R.state === 'installing') {
          setProgress(60 + (R.done / Math.max(1, R.total)) * 38);
          setSt('正在写入 ' + R.done + '/' + R.total);
          renderList(R.done);
        } else if (R.state === 'done' && R.ok) {
          clearInterval(timer); setProgress(100); renderList(R.total); show('done');
          document.getElementById('doneMsg').textContent =
            (R.from === (R.to || R.from)) ? ('当前已是最新版本 ' + R.from)
                                          : ('已从 ' + R.from + ' 更新到 ' + R.to);
        } else if (R.state === 'error') {
          clearInterval(timer); show('err');
          document.getElementById('errMsg').textContent =
            (R.msg || '更新失败') + '\n可以改用【复制下载链接】手动安装。';
        }
      });
    }, 300);
  }

  document.getElementById('go1').onclick = startUpdate;
  document.getElementById('go2').onclick = copyLink;
  document.getElementById('copy2').onclick = copyLink;
  document.getElementById('no').onclick  = closeMe;
  document.getElementById('ok2').onclick = closeMe;
  document.getElementById('ok3').onclick = closeMe;
  document.getElementById('ok4').onclick = closeMe;
})();
</script>
</body>
</html>
